<div class="modal-body">
  <div class="card">
    <div class="form-group">
      <form>
        <div class="col-md">
          <div class="form-floating">
            <input
              type="text"
              id="userName"
              [(ngModel)]="userName"
              name="userName"
              required
              placeholder="Enter username"
              minlength="1"
            />
          </div>
        </div>
        <p></p>
        <div class="col-md">
          <div class="form-floating">
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="Enter password"
              minlength="1"
            />
          </div>
        </div>
        <p></p>
        <p class="panel-buttons">
          <button class="btn btn-success btn-sm" (click)="CreateUser()">RegisterCustomer</button>
          <button class="btn btn-success btn-sm" (click)="Login()">Login</button>
        </p>
      </form>
    </div>
  </div>
</div>
