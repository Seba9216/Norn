<div class="modal-body">
  <div class="card">
    <div class="form-group">
      <form>
        <div class="col-md">
          <div class="form-floating">
            <label for="userName">Username</label>
            <input
              type="text"
              id="userName"
              [(ngModel)]="userName"
              name="userName"
              required
              placeholder="Enter username"
            />
          </div>
        </div>
        <div class="col-md">
          <div class="form-floating">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="Enter password"
            />
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
